"tests/test_bench_restock.py" = '''
import importlib
import pkgutil
import sys
from pathlib import Path

sys.path.insert(0, str(Path(__file__).resolve().parents[1] / "src"))

import shop

for module in pkgutil.iter_modules(shop.__path__):
    importlib.import_module(f"shop.{module.name}")

from shop.reports import REPORTS, row


def test_restock_lists_what_runs_out_before_an_order_arrives() -> None:
    assert REPORTS["restock"]() == [
        row("FIL-02", "Cloth filter", 6),
        row("TEA-01", "Green tea", 6),
        row("KET-01", "Kettle", 16),
    ]


def test_the_other_reports_keep_their_output() -> None:
    assert REPORTS["catalog"]()[0] == row("TEA-01", "Green tea")
    assert row("KET-01", 8) in REPORTS["stock"]()
'''

