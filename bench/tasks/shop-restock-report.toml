[[reference_edit]]
path = "src/shop/reports.py"
old = """@report("best-sellers")"""
new = """@report("restock")
def restock_report() -> list[str]:
    found: list[tuple[int, str, str]] = []
    for item in active():
        daily = average_daily(item.sku)
        if daily <= 0:
            continue
        days = int(available(item.sku) // daily)
        if days <= reorder_window(item.supplier):
            found.append((days, item.sku, item.name))
    return [row(sku, name, days) for days, sku, name in sorted(found)]


@report("best-sellers")"""
