name = "calc-add"
suites = ["mini", "full"]
fixture = "bugfix"
prompt = "In this repo, add() in src/calc/__init__.py returns the difference instead of the sum, so tests/test_calc.py::test_add fails. Fix it. Do not change the tests or the signature of add."

[request]
type = "bug"
what = "Fix add() so it returns the sum of its arguments"
why = "tests/test_calc.py::test_add fails: add(2, 3) returns -1 instead of 5"
where = "src/calc/__init__.py"
tests = "tests/test_calc.py passes"
out_of_scope = "the tests and the signature of add"

[hidden]
"tests/test_bench_add.py" = '''
import sys
from pathlib import Path

sys.path.insert(0, str(Path(__file__).resolve().parents[1] / "src"))

from calc import add


def test_positive() -> None:
    assert add(2, 3) == 5


def test_negative_and_zero() -> None:
    assert add(-4, 1) == -3
    assert add(0, 0) == 0
'''

[reference]
"src/calc/__init__.py" = '''
def add(left: int, right: int) -> int:
    return left + right
