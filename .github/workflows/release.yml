name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
    steps:
      - name: Check out source (checkout 7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv (setup-uv 10.2.0)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Validate release metadata
        id: version
        shell: bash
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/git")
          from tag_release import release_tag

          tag = release_tag(os.environ["GITHUB_SHA"])
          if os.environ["GITHUB_REF_TYPE"] != "tag" or os.environ["GITHUB_REF_NAME"] != tag:
              raise SystemExit(f"Release requires tag {tag}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={tag.removeprefix('v')}\n")
          PY
      - run: uv build
      - name: Upload release distributions (upload-artifact 7.0.1)
        id: distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/cuanta/
    permissions:
      id-token: write
    steps:
      - name: Download release distributions (download-artifact 8.0.1)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
      - name: Publish to PyPI (pypi-publish 1.14.2)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist

  pypi-smoke:
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up uv (setup-uv 10.2.0)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.12"
          enable-cache: false
          tool-dir: ${{ runner.temp }}/cuanta-pypi-tools
          tool-bin-dir: ${{ runner.temp }}/cuanta-pypi-bin
      - name: Install the published version from PyPI
        working-directory: ${{ runner.temp }}
        run: |
          uv tool install --no-config --no-cache --python 3.12 --default-index https://pypi.org/simple "cuanta==$RELEASE_VERSION"
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: cuanta --plain meow
        working-directory: ${{ runner.temp }}
      - run: cuanta --plain doctor
        working-directory: ${{ runner.temp }}
