name: release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate committed release metadata
        id: version
        run: uv run --no-project --python 3.13 python scripts/git/release_metadata.py
      - name: Build locked wheel and npm package
        run: uv run --no-project --python 3.13 python scripts/npm/pack.py
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - name: Smoke installed package and Ubuntu npx
        run: uv run --no-project --python 3.13 python scripts/npm/smoke.py --tarball-dir dist --expected-version "$RELEASE_VERSION" ${{ runner.os == 'Linux' && '--npx' || '' }}
      - name: Focused POSIX process tree, timeout, Ctrl+C and launcher tests
        if: runner.os != 'Windows'
        timeout-minutes: 3
        run: uv run --frozen pytest -n 0 tests/adapters/test_process_hygiene.py tests/unit/test_npm_launcher.py

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - run: npm publish dist/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
