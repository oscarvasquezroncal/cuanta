name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CUANTA_HELP_BUDGET_S: "0.6"
      CUANTA_PAINT_BUDGET_S: "1.5"
      PYTHONUTF8: "1"
    steps:
      - name: Check out source (checkout 7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv (setup-uv 10.2.0)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: ${{ matrix.python }}
          prune-cache: true
      - run: uv sync --python ${{ matrix.python }} --extra web
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -n auto --cov --cov-report=term

  install-smoke:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source (checkout 7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv (setup-uv 10.2.0)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.12"
          prune-cache: true
      - run: uv build
      - shell: bash
        run: uv tool install dist/*.whl
      - run: cuanta --plain meow
      - run: cuanta --plain doctor
