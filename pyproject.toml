[project]
name = "cuanta"
version = "0.2.0"
description = "every token, accounted for — token observability and Forge bootstrap for AI coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "cuanta contributors" }]
keywords = ["claude-code", "codex", "opencode", "tokens", "observability", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Software Development",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "tomlkit>=0.12",
    "httpx>=0.27",
    "textual>=8.2,<9",
]

[project.scripts]
cuanta = "cuanta.cli.app:main"

[project.entry-points."cuanta.engines"]
claude = "cuanta.adapters.engines.claude_code:ClaudeCodeEngine"
codex = "cuanta.adapters.engines.codex:CodexEngine"
opencode = "cuanta.adapters.engines.opencode:OpenCodeEngine"

[project.entry-points."cuanta.test_runners"]
pytest = "cuanta.adapters.testing.pytest_runner:PytestRunner"
jest = "cuanta.adapters.testing.jest_runner:JestRunner"
vitest = "cuanta.adapters.testing.vitest_runner:VitestRunner"
go = "cuanta.adapters.testing.go_runner:GoRunner"
cargo = "cuanta.adapters.testing.cargo_runner:CargoRunner"
generic = "cuanta.adapters.testing.generic_runner:GenericRunner"

[project.entry-points."cuanta.instinct"]
heuristic = "cuanta.adapters.instinct.heuristic:HeuristicInstinct"
jev = "cuanta.adapters.instinct.jev:JevInstinct"
llm = "cuanta.adapters.instinct.llm:LlmInstinct"

[project.optional-dependencies]
web = [
    "textual-serve>=1.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuanta"]

[tool.hatch.build.targets.sdist]
include = ["src/cuanta", "tests", "README.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "textual-dev>=1.8",
    "pytest-textual-snapshot>=1.1",
    "pytest-xdist>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/cuanta/assets", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "RET", "ARG"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0917", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PLR0915", "E501", "PT018"]
"src/cuanta/adapters/**" = ["ARG002"]
"src/cuanta/tui/**" = ["ARG002", "RUF012"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts/git"]
exclude = ["src/cuanta/assets/", "tests/fixtures/"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["tests/fixtures", ".*", "*.egg-info"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
addopts = "-q --strict-markers -p no:cacheprovider --dist=loadgroup -m \"not live\""
markers = [
    "live: requires real agent binaries and network; opt-in with -m live",
    "perf: performance budgets",
]

[tool.coverage.run]
source = ["cuanta"]
branch = true
data_file = "${TEMP-/tmp}/cuanta-coverage"

[tool.coverage.report]
include = ["src/cuanta/domain/*", "src/cuanta/application/*"]
fail_under = 85
